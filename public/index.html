<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Floor is Lava">
<meta name="theme-color" content="#160f13">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Floor is Lava</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
</head>
<body>
<style>
:root{
  --bg0:#160f13; --bg1:#2a161c;
  --stone:#5a5361; --stone-hi:#6f6678; --stone-lo:#3f3947;
  --lava1:#ffb347; --lava2:#ff5a1f; --lava3:#d81e2b;
  --green:#59d666; --green-lo:#2f9e4f; --gold:#ffc93c;
  --cream:#fff3e4; --pink:#ff4d6d; --dim:#b9a8a0; --panel:#3a2e36;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  background:
    radial-gradient(120% 90% at 50% 115%, rgba(216,30,43,.28), transparent 55%),
    radial-gradient(90% 70% at 50% -20%, #33202a, transparent 60%),
    var(--bg0);
  color:var(--cream);
  font-family:"Fredoka","Baloo 2",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  touch-action:none;
  -webkit-user-select:none;user-select:none;
  height:100dvh;
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px)
          calc(env(safe-area-inset-bottom) + 8px) calc(env(safe-area-inset-left) + 10px);}

/* ---------- HUD ---------- */
#hud{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;padding:2px 4px 8px}
#hudrow{display:flex;align-items:center;gap:10px}
#hearts{display:flex;gap:3px}
.heart{width:26px;height:26px;fill:var(--pink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));transition:transform .25s,fill .25s}
.heart.off{fill:#453740;transform:scale(.82)}
#lvlname{flex:1;text-align:center;font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#btnBack{width:34px;height:34px;border-radius:50%;background:var(--panel);font-size:17px;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
#btnBack:active{transform:translateY(2px)}
#timerwrap{height:14px;border-radius:99px;background:#33262d;overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
#timerbar{height:100%;width:100%;border-radius:99px;background:var(--green);transition:width .2s linear}
#timerwrap.low #timerbar{animation:tpulse .5s ease-in-out infinite}
@keyframes tpulse{50%{filter:brightness(1.5)}}

/* ---------- Board ---------- */
#boardwrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#board{position:relative}
.tile{position:absolute;border-radius:18%;
  background:linear-gradient(150deg,var(--stone-hi),var(--stone) 55%,var(--stone-lo));
  box-shadow:inset 0 3px 0 rgba(255,255,255,.09), inset 0 -5px 0 rgba(0,0,0,.28), 0 4px 8px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;pointer-events:none}

.tile.lava{background:radial-gradient(circle at 38% 30%,var(--lava1),var(--lava2) 48%,var(--lava3) 90%);
  box-shadow:0 0 20px rgba(255,90,31,.5), inset 0 0 14px rgba(255,225,160,.55), inset 0 -4px 8px rgba(140,10,20,.7);
  animation:bubble 1.7s ease-in-out infinite}
@keyframes bubble{50%{filter:brightness(1.2) saturate(1.15)}}

.tile.rumble{animation:shake .14s linear infinite}
.tile.rumble::after{background:radial-gradient(circle,rgba(255,110,31,.9),rgba(255,90,31,.12));
  opacity:0;animation:heatup var(--warn,2.5s) linear forwards}
@keyframes heatup{to{opacity:1}}
@keyframes shake{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(1.5px,-1px) rotate(.6deg)}
  50%{transform:translate(-1.5px,1px) rotate(-.6deg)}75%{transform:translate(1px,1.5px) rotate(.4deg)}100%{transform:translate(-1px,-1.5px) rotate(-.4deg)}}

.tile.erupt{background:radial-gradient(circle at 50% 40%,#fff0c0,var(--lava1) 30%,var(--lava2) 60%,var(--lava3) 95%);
  box-shadow:0 0 34px rgba(255,120,40,.85), inset 0 0 18px rgba(255,240,190,.8);
  animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.92)}55%{transform:scale(1.12)}100%{transform:scale(1)}}

.tile.cool{background:linear-gradient(150deg,#4a3038,#3a262d 60%,#2c1c22);
  box-shadow:inset 0 0 10px rgba(255,90,31,.25), inset 0 -4px 0 rgba(0,0,0,.3)}

.tile.wwarn::after{background:radial-gradient(circle,rgba(255,150,60,.55),rgba(255,110,31,.1));opacity:1;transition:opacity .15s}
.tile.plit{background:radial-gradient(circle at 38% 30%,#a8f5b0,var(--green) 60%,var(--green-lo) 95%);
  box-shadow:0 0 16px rgba(89,214,102,.55), inset 0 3px 0 rgba(255,255,255,.25), inset 0 -5px 0 rgba(0,0,0,.22)}

.tile.start{background:radial-gradient(circle at 38% 30%,#9df2a6,var(--green) 55%,var(--green-lo) 95%);
  box-shadow:0 0 14px rgba(89,214,102,.35), inset 0 3px 0 rgba(255,255,255,.25), inset 0 -5px 0 rgba(0,0,0,.25)}
.tile.start .icon::before{content:"👣"}
.tile.goal{background:radial-gradient(circle at 38% 30%,#ffe9a8,var(--gold) 55%,#d99a12 95%);
  box-shadow:0 0 16px rgba(255,201,60,.4), inset 0 3px 0 rgba(255,255,255,.3), inset 0 -5px 0 rgba(0,0,0,.25)}
.tile.goal .icon::before{content:var(--goalicon,"⭐")}
.icon{font-size:calc(var(--ts,60px) * .5);pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.tile.await{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 26px rgba(89,214,102,.8), inset 0 3px 0 rgba(255,255,255,.25)}}
#board.paused .tile,#board.paused .tile::after{animation-play-state:paused}

/* ---------- Pawn (tap modes) ---------- */
#pawn{position:absolute;z-index:4;pointer-events:none;display:none;
  border-radius:50%;background:radial-gradient(circle at 35% 28%,#b4f7bc,#5fd66c 55%,#2f9e4f 95%);
  box-shadow:0 5px 10px rgba(0,0,0,.5), inset 0 3px 0 rgba(255,255,255,.35);
  transition:left .16s ease-out, top .16s ease-out;}
#pawn.show{display:block}
#pawn.hop{animation:hop .18s ease-out}
@keyframes hop{40%{transform:scale(1.18) translateY(-14%)}100%{transform:scale(1)}}
#pawn.hurt{animation:hurt .5s ease-out}
@keyframes hurt{0%,100%{filter:none}30%{filter:brightness(1.6) saturate(2) hue-rotate(-60deg);transform:scale(.8)}}
#pawn .eye{position:absolute;top:26%;width:22%;height:26%;background:#fff;border-radius:50%}
#pawn .eye::after{content:"";position:absolute;left:28%;top:32%;width:46%;height:46%;background:#26333a;border-radius:50%}
#pawn .eye.l{left:18%}
#pawn .eye.r{right:18%}

/* ---------- Ring / FX / toast / count ---------- */
#ring{position:fixed;width:74px;height:74px;border-radius:50%;pointer-events:none;display:none;
  z-index:5;margin:-37px 0 0 -37px}
#ring.on{display:block;border:5px solid rgba(158,255,170,.95);box-shadow:0 0 16px rgba(89,214,102,.7), inset 0 0 12px rgba(89,214,102,.5)}
#ring.hang{display:block;border:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:6}
#flash{position:fixed;inset:0;background:radial-gradient(circle,rgba(255,60,30,.55),rgba(216,30,43,.75));
  opacity:0;pointer-events:none;z-index:7;transition:opacity .5s}
#flash.go{opacity:1;transition:none}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translateX(-50%) translateY(20px);
  background:var(--panel);color:var(--cream);padding:11px 20px;border-radius:99px;font-weight:600;font-size:16px;
  white-space:nowrap;opacity:0;transition:.25s;z-index:8;box-shadow:0 6px 16px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#count{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:110px;font-weight:700;z-index:8;
  color:var(--gold);text-shadow:0 6px 0 rgba(90,10,15,.8),0 10px 30px rgba(255,90,31,.5);display:none;pointer-events:none}
#count.show{display:block;animation:cpop .82s ease-out}
@keyframes cpop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* ---------- Overlay screens ---------- */
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(16,10,13,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#overlay.hidden{display:none}
.screen{text-align:center;padding:24px 22px calc(env(safe-area-inset-bottom) + 24px);max-width:460px;width:96%;
  max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.hidden{display:none}
.logo{font-weight:700;font-size:clamp(40px,10vw,68px);line-height:.95;letter-spacing:.01em;
  background:linear-gradient(175deg,var(--gold) 12%,var(--lava2) 55%,var(--lava3) 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(90,10,15,.85)) drop-shadow(0 8px 22px rgba(255,90,31,.35));
  transform:rotate(-2deg)}
.logo em{font-style:normal;display:block;font-size:.42em;letter-spacing:.42em;color:var(--cream);
  -webkit-text-fill-color:var(--cream);filter:none;transform:rotate(1deg);margin:6px 0 2px}
.tag{margin-top:12px;font-size:18px;font-weight:600}
.bigbtn{margin-top:18px;font-weight:700;font-size:22px;letter-spacing:.08em;color:#3b2404;
  background:linear-gradient(180deg,#ffe9a8,var(--gold) 55%,#eda813);border-radius:22px;
  padding:15px 46px;box-shadow:0 6px 0 #9c6c08, 0 12px 24px rgba(0,0,0,.5);display:block;margin-left:auto;margin-right:auto;min-width:240px}
.bigbtn:active{transform:translateY(5px);box-shadow:0 1px 0 #9c6c08}
.bigbtn.alt{background:linear-gradient(180deg,#9df2a6,var(--green) 55%,#37a052);box-shadow:0 6px 0 #1c6e35,0 12px 24px rgba(0,0,0,.5);color:#0b3317}
.bigbtn.alt:active{box-shadow:0 1px 0 #1c6e35}
.bigbtn.ghost{background:var(--panel);color:var(--cream);box-shadow:0 6px 0 #241c21,0 12px 24px rgba(0,0,0,.4);font-size:18px;padding:12px 34px;min-width:0}
.bigbtn.ghost:active{box-shadow:0 1px 0 #241c21}
.mini{margin-top:16px;font-size:13px;color:#8d7a76;letter-spacing:.04em}
.screen h2{font-size:30px;font-weight:700;margin-bottom:4px}
.screen .sub{color:var(--dim);font-size:15px;font-weight:500;margin-bottom:14px}

/* world sections on the map */
.worldsec{background:rgba(58,46,54,.55);border-radius:22px;padding:14px 14px 16px;margin-top:14px;text-align:left}
.worldsec.locked{opacity:.45;filter:saturate(.4)}
.whead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wicon{font-size:26px}
.wname{font-weight:700;font-size:18px;flex:1}
.wmode{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.lvls{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.lvldot{position:relative;aspect-ratio:1;border-radius:30%;background:linear-gradient(150deg,var(--stone-hi),var(--stone-lo));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.12), inset 0 -4px 0 rgba(0,0,0,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--cream)}
.lvldot:active{transform:scale(.94)}
.lvldot.done{background:linear-gradient(150deg,#7ee08a,var(--green-lo))}
.lvldot.cur{background:linear-gradient(150deg,#ffe9a8,#eda813);color:#3b2404;animation:pulse 1.2s ease-in-out infinite}
.lvldot.lock{pointer-events:none;color:#7a6a72}
.lvldot .st{font-size:9px;letter-spacing:1px;line-height:1;margin-top:2px;color:var(--gold)}
.lvldot.cur .st{color:#7a5205}
.lvldot .animal{position:absolute;top:-9px;right:-6px;font-size:16px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}

/* free play cards */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.modecard{background:rgba(58,46,54,.6);border-radius:22px;padding:18px 10px 14px;text-align:center;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.08), inset 0 -5px 0 rgba(0,0,0,.3)}
.modecard:active{transform:scale(.96)}
.modecard .mi{font-size:38px;line-height:1}
.modecard .mn{font-weight:700;font-size:17px;margin-top:8px}
.modecard .md{font-size:12px;color:var(--dim);font-weight:500;margin-top:3px;min-height:2.4em}
.modecard .mb{font-size:12px;color:var(--gold);font-weight:600;margin-top:6px}

/* chips (options) */
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chiplbl{font-size:12px;color:#8d7a76;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-top:14px}
.chip{background:var(--panel);border-radius:99px;padding:9px 18px;font-weight:600;font-size:14px;color:var(--dim);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.chip.on{background:linear-gradient(180deg,#9df2a6,var(--green) 60%,#37a052);color:#0b3317;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.chip:active{transform:scale(.94)}

#endEmoji{font-size:64px;line-height:1}
#endTitle{font-size:36px;font-weight:700;margin-top:10px}
#endStars{font-size:34px;letter-spacing:.12em;margin-top:6px;min-height:42px}
#endMsg{margin-top:4px;font-size:17px;color:var(--dim);font-weight:500}
.btnrow{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.btnrow .bigbtn{margin:0}

@media (prefers-reduced-motion:reduce){
  .tile.rumble{animation:none;outline:4px solid var(--lava2)}
  .tile.lava,.tile.await,.lvldot.cur{animation:none}
}
</style>

<div id="app">
  <div id="hud">
    <div id="hudrow">
      <div id="hearts"></div>
      <div id="lvlname"></div>
      <button id="btnBack" aria-label="Back">‹</button>
    </div>
    <div id="timerwrap"><div id="timerbar"></div></div>
  </div>
  <div id="boardwrap">
    <div id="board"></div>
    <div id="pawn"><div class="eye l"></div><div class="eye r"></div></div>
  </div>
</div>

<div id="ring"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div id="toast"></div>
<div id="count"></div>

<div id="overlay">
  <div class="screen" id="scrTitle">
    <h1 class="logo">FLOOR<em>· IS ·</em>LAVA</h1>
    <p class="tag">Don't touch the lava! 🌋</p>
    <button class="bigbtn" id="btnAdventure">🗺️ ADVENTURE</button>
    <button class="bigbtn alt" id="btnFree">🎮 FREE PLAY</button>
    <div class="chips">
      <button class="chip" id="chSound">🔊 Sound</button>
      <button class="chip" id="chVoice">🗣️ Voice</button>
    </div>
    <p class="mini" id="titleMini">5 WORLDS · 30 LEVELS · 4 WAYS TO PLAY</p>
  </div>

  <div class="screen hidden" id="scrMap">
    <h2>Adventure Map</h2>
    <p class="sub">Clear a level to unlock the next!</p>
    <div id="worlds"></div>
    <button class="bigbtn ghost" id="btnMapHome" style="margin-top:18px">‹ Home</button>
  </div>

  <div class="screen hidden" id="scrFree">
    <h2>Free Play</h2>
    <p class="sub">Pick a game — how many stages can you survive?</p>
    <div class="chiplbl">Difficulty</div>
    <div class="chips" id="diffChips">
      <button class="chip" data-d="easy">🌱 Easy</button>
      <button class="chip" data-d="normal">🔥 Normal</button>
      <button class="chip" data-d="hard">🌋 Hard</button>
    </div>
    <div class="chips">
      <button class="chip" id="chTimer">⏱️ Timer</button>
    </div>
    <div class="modes" id="modeCards" style="margin-top:16px"></div>
    <button class="bigbtn ghost" id="btnFreeHome" style="margin-top:18px">‹ Home</button>
  </div>

  <div class="screen hidden" id="scrEnd">
    <div id="endEmoji">🎉</div>
    <h2 id="endTitle"></h2>
    <div id="endStars"></div>
    <p id="endMsg"></p>
    <div class="btnrow">
      <button class="bigbtn" id="btnNext">NEXT ›</button>
      <button class="bigbtn ghost" id="btnEndMap">Map</button>
    </div>
  </div>
</div>

<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="hh" viewBox="0 0 24 24">
    <path d="M12 21.2C6.2 16.9 2.8 13.2 2.8 9.4 2.8 6.7 4.9 4.6 7.6 4.6c1.8 0 3.4 1 4.4 2.5 1-1.5 2.6-2.5 4.4-2.5 2.7 0 4.8 2.1 4.8 4.8 0 3.8-3.4 7.5-9.2 11.8z"/>
  </symbol>
</svg>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const board = $("board"), wrap = $("boardwrap"), ring = $("ring"), pawn = $("pawn"),
      toastEl = $("toast"), overlay = $("overlay"), countEl = $("count");
const HEARTS = 5, HANG = 1.0, ERUPT_T = 1.5, COOL_T = 0.7;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// ---------------- save ----------------
const SAVE_KEY = "fil_v1";
let save = { stars: {}, unlocked: 1, freeBest: {} };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.stars) save = s; } catch (_) {}
if (save.sound === undefined) save.sound = true;
if (save.voice === undefined) save.voice = true;
if (save.freeDiff === undefined) save.freeDiff = "easy";
if (save.freeTimer === undefined) save.freeTimer = true;
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {} }

// ---------------- voice ----------------
let VOICE = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices();
    if (!vs.length) return;
    VOICE = vs.find(v => /^en/i.test(v.lang) && /Samantha|Karen|Google US English/i.test(v.name))
         || vs.find(v => /^en/i.test(v.lang)) || vs[0];
  } catch (_) {}
}
try { pickVoice(); speechSynthesis.addEventListener("voiceschanged", pickVoice); } catch (_) {}
function say(text, rate) {
  if (!save.voice || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if (VOICE) u.voice = VOICE;
    u.rate = rate || 1.05; u.pitch = 1.12;
    speechSynthesis.speak(u);
  } catch (_) {}
}

// ---------------- worlds & levels ----------------
const WORLDS = [
  { name: "The Meadow",      icon: "🌿", mode: "slide", label: "Slide" },
  { name: "Stepping Stones", icon: "🪨", mode: "steps", label: "Steps" },
  { name: "The Dark Caves",  icon: "🌑", mode: "path",  label: "Memory" },
  { name: "Lava River",      icon: "🌊", mode: "waves", label: "Waves" },
  { name: "The Big Volcano", icon: "🌋", mode: "mix",   label: "Everything" },
];
const ANIMALS = ["🐢", "🐰", "🦊", "🐧", "🦖"];
const ANIMAL_NAMES = ["turtle", "bunny", "fox", "penguin", "dino"];
const MODES = {
  slide: { icon: "🐾", name: "Slide", desc: "Keep your finger down, slide off rumbling tiles" },
  steps: { icon: "👣", name: "Steps", desc: "Tap tile by tile like the arcade floor" },
  path:  { icon: "🧠", name: "Memory Path", desc: "Watch the path light up, then walk it" },
  waves: { icon: "🌊", name: "Lava Waves", desc: "Read the wave pattern, hop through the gaps" },
};
function sl(warn, int, lava, extras, pT, timer) { return { mode: "slide", warn, int, lava, extras, pT, timer }; }
function st(warn, int, lava, extras, pT, timer) { return { mode: "steps", warn, int, lava, extras, pT, timer }; }
function pa(len, memT, mercy, timer) { return { mode: "path", len, memT, mercy, timer }; }
function wa(beat, every, gapW, cycle, timer) { return { mode: "waves", beat, every, gapW, cycle, timer }; }
const LEVELS = [
  sl(3.2, 3.6, .08, 1, .35, 60), sl(3.0, 3.2, .10, 1, .45, 60), sl(2.8, 3.0, .12, 1, .50, 55),
  sl(2.6, 2.8, .13, 1, .50, 55), sl(2.4, 2.6, .14, 2, .55, 50), sl(2.3, 2.4, .15, 2, .55, 50),

      const frac = G.cfg.cycle[this.cycleIdx % G.cfg.cycle.length];
      this.cycleIdx++;
      this.waves.push({ row: 1, gaps: this.gapCols(frac) });
    }
    this.render();
    if (G.phase === "playing" && this.isLava(G.pTile)) burn("🔥 The wave got you!");
  },
  isLava(i) {
    const c = i % S.cols, r = (i / S.cols) | 0;
    return this.waves.some(w => w.row === r && !w.gaps.includes(c));
  },
  render() {
    S.tiles.forEach((t, i) => {
      const c = i % S.cols, r = (i / S.cols) | 0;
      let lava = false, warn = false;
      for (const w of this.waves) {
        if (w.row === r && !w.gaps.includes(c)) lava = true;
        if (w.row + 1 === r && r <= S.rows - 2 && !w.gaps.includes(c)) warn = true;
      }
      if (i === S.start || i === S.goal) { lava = false; warn = false; }
      t.el.classList.toggle("lava", lava || t.fixed);
      t.el.classList.toggle("wwarn", warn && !lava);
      t.state = lava ? "lava" : "safe";
    });
  },
  down(e, i) {
    tapStep(i, j => !this.isLava(j), j => this.isLava(j), "🔥 You hopped into the wave!");
  },
  move() {}, up() {},
  tick(dt) {
    this.beatAcc += dt;
    if (this.beatAcc >= G.cfg.beat) { this.beatAcc -= G.cfg.beat; this.beat(); }
  },
  watchTick(dt) {
    this.tick(dt);
    this.watchLeft -= dt;
    if (this.watchLeft <= 0 && !this.counting) {
      this.counting = true;
      countdown(() => { G.phase = "playing"; G.invulnUntil = G.t + .5; this.counting = false; });
    }
  },
  onBurn() {
    pawn.classList.remove("hurt"); void pawn.offsetWidth; pawn.classList.add("hurt");
    G.pTile = S.start; pawnTo(S.start, true); G.invulnUntil = G.t + 1.2;
  },
  cleanup() { S.tiles.forEach(t => t.el.classList.remove("wwarn")); },
};

// ---------------- flow ----------------
function resetRun() {
  countT.forEach(clearTimeout); countT = [];
  G.ctrl && G.ctrl.cleanup && G.ctrl.cleanup();
  G.t = 0; G.burns = 0; G.pTile = -1; G.ptrId = null;
  G.air = G.off = false; G.nextErupt = 0; G.invulnUntil = 0; G.lastSaid = 0;
  board.classList.remove("paused"); hideRing(); hidePawn();
  countEl.classList.remove("show");
}
function startLevel(i) {
  resetRun();
  G.lvlIdx = i; G.free = null;
  G.cfg = LEVELS[i];
  const id = i + 1, w = (i / 6) | 0;
  G.animal = id % 6 === 0 ? ANIMALS[w] : null;
  $("lvlname").textContent = `${WORLDS[w].icon} ${WORLDS[w].name} · Level ${id}`;
  launch();
}
function startFree(style, stage) {
  resetRun();
  G.free = { style, stage };
  if (stage === 1) G.hearts = HEARTS;
  const boost = { easy: 0, normal: 3, hard: 7 }[save.freeDiff] || 0;
  G.cfg = freeCfg(style, stage + boost);
  if (!save.freeTimer) G.cfg = Object.assign({}, G.cfg, { timer: 9999 });
  G.animal = null;
  $("lvlname").textContent = `${MODES[style].icon} ${MODES[style].name} · Stage ${stage}`;
  launch();
}
function launch() {
  G.screen = "game";
  overlay.classList.add("hidden");
  $("timerwrap").style.visibility = G.cfg.timer > 999 ? "hidden" : "visible";
  updateHearts(); layout();
  G.ctrl = CTRL[G.cfg.mode];
  G.ctrl.start();
  timerUI();
}
function retryCurrent() { G.hearts = HEARTS; if (G.free) startFree(G.free.style, 1); else startLevel(G.lvlIdx); }

// ---------------- screens ----------------
function showScreen(id) {
  G.screen = id;
  overlay.classList.remove("hidden");
  ["scrTitle", "scrMap", "scrFree", "scrEnd"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  if (id === "scrMap") renderMap();
  if (id === "scrFree") renderFree();
  if (id === "scrTitle" || id === "scrFree") syncChips();
}
function renderMap() {
  const holder = $("worlds");
  holder.innerHTML = "";
  WORLDS.forEach((w, wi) => {
    const first = wi * 6 + 1;
    const locked = first > save.unlocked;
    const sec = document.createElement("div");
    sec.className = "worldsec" + (locked ? " locked" : "");
    let dots = "";
    for (let k = 0; k < 6; k++) {
      const id = first + k;
      const stars = save.stars[id] || 0;
      const cls = id < save.unlocked || stars ? "done" : id === save.unlocked ? "cur" : "lock";
      const animal = id % 6 === 0 ? `<span class="animal">${ANIMALS[wi]}</span>` : "";
      dots += `<div class="lvldot ${cls}" data-lvl="${id}">${cls === "lock" ? "🔒" : id}${animal}
        <span class="st">${stars ? "★".repeat(stars) : cls === "lock" ? "" : "&nbsp;"}</span></div>`;
    }
    sec.innerHTML = `<div class="whead"><span class="wicon">${w.icon}</span>
      <span class="wname">${w.name}</span><span class="wmode">${w.label}</span></div>
      <div class="lvls">${dots}</div>`;
    holder.appendChild(sec);
  });
  holder.querySelectorAll(".lvldot.done,.lvldot.cur").forEach(el =>
    el.addEventListener("click", () => { sndHop(); startLevel(+el.dataset.lvl - 1); }));
}
function renderFree() {
  const holder = $("modeCards");
  holder.innerHTML = "";
  Object.entries(MODES).forEach(([key, m]) => {
    const best = save.freeBest[key] || 0;
    const card = document.createElement("div");
    card.className = "modecard";
    card.innerHTML = `<div class="mi">${m.icon}</div><div class="mn">${m.name}</div>
      <div class="md">${m.desc}</div><div class="mb">${best ? "Best: " + best + " stages" : "Not played yet"}</div>`;
    card.addEventListener("click", () => { sndHop(); G.hearts = HEARTS; startFree(key, 1); });
    holder.appendChild(card);
  });
}
function syncChips() {
  $("chSound").classList.toggle("on", !!save.sound);
  $("chVoice").classList.toggle("on", !!save.voice);
  const tc = $("chTimer");
  if (tc) { tc.classList.toggle("on", !!save.freeTimer); tc.textContent = save.freeTimer ? "⏱️ Timer on" : "⏱️ No timer"; }
  document.querySelectorAll("#diffChips .chip").forEach(el =>
    el.classList.toggle("on", el.dataset.d === save.freeDiff));
}
$("chSound").addEventListener("click", () => { ensureAudio(); save.sound = !save.sound; persist(); syncChips(); if (save.sound) beep(520, .1, "triangle", .15); });
$("chVoice").addEventListener("click", () => { ensureAudio(); save.voice = !save.voice; persist(); syncChips(); if (save.voice) say("Voice on!"); });
$("chTimer").addEventListener("click", () => { save.freeTimer = !save.freeTimer; persist(); syncChips(); });
document.querySelectorAll("#diffChips .chip").forEach(el =>
  el.addEventListener("click", () => { save.freeDiff = el.dataset.d; persist(); syncChips(); sndHop(); }));
$("btnAdventure").addEventListener("click", () => { ensureAudio(); G.hearts = HEARTS; updateHearts(); showScreen("scrMap"); });
$("btnFree").addEventListener("click", () => { ensureAudio(); showScreen("scrFree"); });
$("btnMapHome").addEventListener("click", () => showScreen("scrTitle"));
$("btnFreeHome").addEventListener("click", () => showScreen("scrTitle"));
$("btnBack").addEventListener("click", () => { resetRun(); G.phase = "idle"; showScreen(G.free ? "scrFree" : "scrMap"); });
$("btnNext").addEventListener("click", () => {
  ensureAudio();
  if (G.phase === "lost") { retryCurrent(); return; }
  if (G.free) { startFree(G.free.style, 1); return; }
  if (G.lvlIdx < 29) startLevel(G.lvlIdx + 1); else showScreen("scrMap");
});
$("btnEndMap").addEventListener("click", () => { resetRun(); G.phase = "idle"; showScreen(G.free ? "scrFree" : "scrMap"); });

// ---------------- input ----------------
function onDown(e) {
  ensureAudio();
  if (G.screen !== "game" || !G.ctrl) return;
  G.lastXY = [e.clientX, e.clientY];
  if (G.ctrl === CTRL.slide && G.ptrId !== null && e.pointerId !== G.ptrId) { toast("One finger for one player! ☝️", 1.5); return; }
  G.ctrl.down(e, tileAt(e.clientX, e.clientY));
}
function onMove(e) {
  if (G.screen !== "game" || !G.ctrl) return;
  if (G.ctrl === CTRL.slide && e.pointerId === G.ptrId) G.lastXY = [e.clientX, e.clientY];
  G.ctrl.move(e, tileAt(e.clientX, e.clientY));
}
function onUp(e) { if (G.screen === "game" && G.ctrl) G.ctrl.up(e); }
wrap.addEventListener("pointerdown", onDown);
addEventListener("pointermove", onMove);
addEventListener("pointerup", onUp);
addEventListener("pointercancel", onUp);
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("dblclick", e => e.preventDefault());

// ---------------- main loop ----------------
let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (G.screen === "game" && G.ctrl) {
    if (G.phase === "playing") {
      G.t += dt;
      G.ctrl.tick(dt);
      if (G.phase === "playing") {
        timerUI();
        if (G.cfg.timer < 999) {
          const left = Math.ceil(G.cfg.timer - G.t);
          if (left <= 5 && left >= 1 && left !== G.lastSaid) {
            G.lastSaid = left;
            say(String(left), 1.15);
            beep(620, .08, "triangle", .12);
          }
        }
        if (G.t >= G.cfg.timer) timeUp();
      }
    } else if (G.phase === "watch" && G.ctrl.watchTick) G.ctrl.watchTick(dt);
  }
  drawFX(dt);
  requestAnimationFrame(frame);
}

// ---------------- particles ----------------
const fx = $("fx"), ctx = fx.getContext("2d");
let embers = [], confs = [];
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function sizeFx() {
  const d = Math.min(devicePixelRatio || 1, 2);
  fx.width = innerWidth * d; fx.height = innerHeight * d;
  fx.style.width = innerWidth + "px"; fx.style.height = innerHeight + "px";
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
sizeFx();
function newEmber() {
  return { x: Math.random() * innerWidth, y: innerHeight + 10, s: 1 + Math.random() * 2.4,
    vy: 14 + Math.random() * 26, dr: (Math.random() - .5) * 14, a: .25 + Math.random() * .45 };
}
if (!reduceMotion) for (let i = 0; i < 22; i++) { const e = newEmber(); e.y = Math.random() * innerHeight; embers.push(e); }
function confetti() {
  const colors = ["#ffc93c", "#59d666", "#ff4d6d", "#fff3e4", "#ff5a1f", "#6ec6ff"];
  for (let i = 0; i < 150; i++)
    confs.push({ x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .35,
      vx: (Math.random() - .5) * 520, vy: -260 - Math.random() * 380,
      s: 5 + Math.random() * 6, rot: Math.random() * 6.3, vr: (Math.random() - .5) * 10,
      c: colors[(Math.random() * colors.length) | 0], life: 2.6 });
}
function drawFX(dt) {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const e of embers) {
    e.y -= e.vy * dt; e.x += e.dr * dt;
    if (e.y < -12) Object.assign(e, newEmber());
    ctx.globalAlpha = e.a; ctx.fillStyle = "#ff8a3c";
    ctx.beginPath(); ctx.arc(e.x, e.y, e.s, 0, 6.3); ctx.fill();
  }
  ctx.globalAlpha = 1;
  confs = confs.filter(p => (p.life -= dt) > 0);
  for (const p of confs) {
    p.vy += 640 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.min(1, p.life);
    ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .62);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ---------------- audio ----------------
let AC = null;
function ensureAudio() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  } catch (_) {}
}
function beep(f0, dur, type, vol, f1) {
  if (!AC || !save.sound) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + .02);
  } catch (_) {}
}
function noiseBurst(dur, vol) {
  if (!AC || !save.sound) return;
  try {
    const n = AC.sampleRate * dur | 0, buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = AC.createBufferSource(), g = AC.createGain();
    src.buffer = buf; g.gain.value = vol;
    src.connect(g); g.connect(AC.destination); src.start();
  } catch (_) {}
}
const sndStep = () => beep(540 + Math.random() * 80, .05, "triangle", .07);
const sndHop = () => { beep(430, .07, "triangle", .12, 620); };
const sndLand = () => beep(170, .09, "sine", .18, 110);
const sndRumble = () => beep(72, .4, "sawtooth", .1, 52);
const sndErupt = () => { noiseBurst(.22, .22); beep(230, .3, "sawtooth", .16, 60); };
const sndBurn = () => { beep(330, .45, "sawtooth", .22, 70); noiseBurst(.3, .18); };
function sndWin() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .28, "triangle", .2), i * 110)); }
function sndLose() { [330, 262, 196].forEach((f, i) => setTimeout(() => beep(f, .32, "triangle", .16), i * 160)); }

// ---------------- boot ----------------
updateHearts();
buildBoard({ lava: .12 });
$("lvlname").textContent = "5 worlds · 30 levels";
showScreen("scrTitle");
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
